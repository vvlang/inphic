name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0（留空则用 VERSION 文件的值）"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 DMG
    runs-on: macos-15

    steps:
      # 刻意不使用任何 Action（含 actions/checkout、actions/upload-artartifact）。
      # 构建只依赖 runner 自带的 Swift / Rust / gh CLI，
      # 发布走 gh CLI，整个工作流不执行第三方代码。
      - name: Checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)" \
              fetch --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD

      - name: 读取版本
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="$INPUT_TAG"
          if [ "$IS_TAG_PUSH" = "true" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -z "$TAG" ]; then
            TAG="v${FILE_VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "构建 $TAG（VERSION 文件：$FILE_VERSION）"

      - name: 环境
        run: rustup component add clippy rustfmt

      - name: Rust 协议层测试
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Swift 测试
        env:
          INPHIC_SCRATCH: /tmp/inphic-build
        run: swift test --scratch-path /tmp/inphic-build

      - name: 构建 .app
        env:
          INPHIC_SCRATCH: /tmp/inphic-build
          INPHIC_DIST: /tmp/inphic-dist
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-app.sh release

      - name: 打包 DMG
        run: ./Scripts/make-dmg.sh /tmp/inphic-dist/InphicHub.app

      - name: 校验产物
        run: |
          set -euo pipefail
          ls -lh dist/
          DMG=$(ls dist/*.dmg)
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint /tmp/dmg-verify >/dev/null
          test -d /tmp/dmg-verify/InphicHub.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            /tmp/dmg-verify/InphicHub.app/Contents/Info.plist
          hdiutil detach /tmp/dmg-verify >/dev/null

      # ad-hoc 签名，未做 Apple 公证。首次打开需右键 → 打开。
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail

          # 手动触发时先确保 tag 存在，否则 gh release 找不到它
          if ! git ls-remote --exit-code --tags "https://github.com/${REPO}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "  · tag $TAG 不存在，创建并指向当前提交"
            git tag "$TAG"
            git push origin "$TAG"
          fi

          NOTES=$(cat <<'TEXT'
          ## Inphic Hub

          英菲克（INPHIC）鼠标的 macOS 设置程序。非官方工具。

          ### 安装
          1. 下载 `.dmg`
          2. 拖进「应用程序」
          3. 首次打开需**右键 → 打开**（未做 Apple 公证与开发者签名）

          ### 已知限制
          - 固件不支持读回设置：能读电量，读不回 DPI / 灯光 / 按键
          - 鼠标进深睡后会丢弃写入，本工具会自动重发唤醒
          - 蓝牙通道尚未实机验证

          协议细节见仓库内 `docs/PROTOCOL.md`。
          TEXT
          )

          if [ "$IS_TAG_PUSH" = "true" ]; then
            gh release upload "$TAG" dist/*.dmg --clobber
            gh release edit "$TAG" --title "Inphic Hub $VERSION" --notes "$NOTES"
            echo "  · 已发布 $TAG"
          else
            gh release create "$TAG" dist/*.dmg \
              --title "Inphic Hub $VERSION (manual)" --notes "$NOTES" --draft
            echo "  · 草稿已创建：$TAG"
          fi
